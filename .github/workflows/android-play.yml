name: Android Play Internal

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName
        required: true
        default: "1.0"
      play_track:
        description: Google Play track
        required: true
        default: internal

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      OP_VERSION_CODE: ${{ github.run_number }}
      OP_VERSION_NAME: ${{ inputs.version_name }}
      PLAY_TRACK: ${{ inputs.play_track }}
      ANDROID_KEYSTORE_PATH: upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - run: npm ci

      - name: Restore Android upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - run: npm run typecheck

      - run: npm run test

      - run: npm run mobile:android:release

      - uses: actions/upload-artifact@v4
        with:
          name: openpolitics-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play internal track
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: bundle exec fastlane internal
        working-directory: android
